name: Update Vebo Events

on:
  repository_dispatch:
    types:
      - scrape-vebo-events
  workflow_dispatch:
    inputs:
      targetUrl:
        description: "URL to scrape (leave blank to use the VEBO_TARGET_URL repo variable)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Checkout Data Branch
        uses: actions/checkout@v7
        with:
          ref: data
          path: data
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: playwright install --with-deps chromium

      - name: Determine Target URL
        id: determine-url
        env:
          MANUAL_URL: ${{ github.event.inputs.targetUrl }}
          DISPATCH_URL: ${{ github.event.client_payload.targetUrl }}
          FALLBACK_URL: ${{ vars.VEBO_TARGET_URL }}
        run: |
          if [ -n "$MANUAL_URL" ]; then
            URL="$MANUAL_URL"
          elif [ -n "$DISPATCH_URL" ]; then
            URL="$DISPATCH_URL"
          elif [ -n "$FALLBACK_URL" ]; then
            URL="$FALLBACK_URL"
          else
            echo "No targetUrl input, client_payload.targetUrl, or VEBO_TARGET_URL repo variable set."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Run Scrape Script
        id: scrape
        continue-on-error: true
        env:
          TARGET_URL: ${{ steps.determine-url.outputs.url }}
          OUTPUT_PATH: data/vebo_events.json
          APP_VERSION_PATH: data/app_version.json
          LEAGUE_MAP_JSON: ${{ vars.LEAGUE_MAP_JSON }}
        run: python scripts/scrape_matches.py

      - name: Commit and Push to Data Branch
        run: |
          cd data
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add vebo_events.json app_version.json
          if ! git diff --staged --quiet; then
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit --amend -m "Automated data: Updated at $TIMESTAMP"
            git push --force origin data
          else
            echo "No changes detected. Skipping commit."
          fi

      - name: Fail Job If Scrape Failed
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "Scrape script failed — maintenance flag has been set. See logs above."
          exit 1
