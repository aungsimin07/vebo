name: Delete Old Workflow Runs

on:
  workflow_dispatch:
  repository_dispatch:
    types: [delete-old-runs]

permissions:
  contents: read

jobs:
  delete-old-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete workflow runs older than 1 days
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 3
          dry_run: false
